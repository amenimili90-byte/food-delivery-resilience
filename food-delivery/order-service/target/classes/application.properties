spring.application.name=order-service
server.port=8081

# ─── DataSource (H2 in-memory) ───────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# ─── Delivery Service URL ─────────────────────────────────────────────────────
delivery.service.url=http://localhost:8083

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ─── Resilience4j Circuit Breaker ─────────────────────────────────────────────
resilience4j.circuitbreaker.instances.deliveryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.deliveryService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.deliveryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.deliveryService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.deliveryService.permitted-number-of-calls-in-half-open-state=3

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.io.github.resilience4j=DEBUG
logging.level.com.fooddelivery=DEBUG